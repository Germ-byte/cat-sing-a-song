appId: com.catdesk.music
productName: CatDesk Music
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/**/*
  - package.json
asar: false
mac:
  category: public.app-category.music
  target:
    - target: zip
      arch:
        - arm64
        - x64
    - target: dmg
      arch:
        - arm64
        - x64
win:
  target:
    - target: nsis
      arch:
        - x64
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Audio
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: true
  createDesktopShortcut: true
