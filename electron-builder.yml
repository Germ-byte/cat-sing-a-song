appId: com.catdesk.music
productName: CatDesk Music
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - dist-electron/**/*
mac:
  category: public.app-category.music
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: resources/icon.png
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.png
linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: resources/icon.png
  category: Audio
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
